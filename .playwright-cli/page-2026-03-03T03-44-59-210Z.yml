    - generic [ref=e793]:
      - generic [ref=e794]:
        - paragraph [ref=e795]:
          - text: "License:"
          - strong [ref=e796]:
            - link "#349123" [ref=e799] [cursor=pointer]:
              - /url: https://springfinancial.ca/wp-content/uploads/2025/11/license2025.614f1c1.png
        - paragraph [ref=e800]:
          - superscript [ref=e801]: "*"
          - text: Spring Financial Inc. provides loans up to $35,000 with interest rates ranging from 9.99% to 34.95%, and APRs ranging from 9.99% to 35.00%, with terms from 6 to 84 months. Your actual rate will depend on a variety of factors such as your credit score and the loan amount. An example of borrowing costs paid on a $5,000 loan with a 48 month term at 9.99% APR is a Weekly payment of $29.17, with the total repayment amount of principal and interest being $6,066.48 and the total cost of the loan (interest only) being $1,066.48.
        - paragraph [ref=e802]: To qualify for The Foundation, you must have an active account with a bank or financial institution, as approved by Spring Financial, and a valid government-issued Canadian ID. The Foundation is available in all provinces except Saskatchewan and New Brunswick. Results from The Foundation depend on the individual. All guarantee references are made in connection to the Evergreen Loan. To qualify for the Evergreen Loan, you must first successfully complete 12 months on The Foundation and save $750, have an active account with a bank or financial institution, as approved by Spring Financial, and a valid government-issued Canadian ID. Your savings component will be automatically held in trust for you. Individual results may vary. Other credit score factors, including late payments, activity with your other tradelines and credit utilization may impact results.
        - paragraph [ref=e803]: "Auto financing (Private Sales): Spring Financial provides financing for up to $75,000 with interest rates ranging from 11.90% to 29.90%, and APRs from 12.90% to 35.00%, with terms from 36 to 84 months. Your actual rate will depend on a variety of factors such as your credit score and the financing amount. An example of borrowing costs paid on a $5,000 financing with a 48 month term at 12.90% APR is a Weekly payment of $30.77, with the total repayment amount of principal and interest being $6,400.29 and the total cost of the financing (interest only) being $1,400.29."
        - paragraph [ref=e804]: "Powersports financing (Private Sales): Spring Financial provides powersports vehicle financing for up to $75,000 with interest rates ranging from 8.99% to 29.99%, and APRs from 8.99% to 34.95%, with terms from 12 to 180 months. Your actual rate will depend on a variety of factors such as your credit score and the financing amount. An example of borrowing costs paid on a $5,000 financing with a 48 month term at 9.99% APR is a Weekly payment of $29.17, with the total repayment amount of principal and interest being $6,066.48 and the total cost of the financing (interest only) being $1,066.48."
